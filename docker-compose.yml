# Local development: `docker compose up -d postgres jaeger`, then run the API with uv (see README).
# The `app` profile runs the packaged backend image instead:
#   docker compose --profile app build
#   docker compose --profile app run --rm migrate
#   docker compose --profile app up -d api        # http://localhost:8001/api/health
#   docker compose --profile app run --rm pipeline # calls the Kroger and DeepSeek APIs

x-app: &app
  image: shrinkflation-backend:local
  build:
    context: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://shrink:shrink@postgres:5432/shrink
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  depends_on:
    postgres:
      condition: service_healthy
    jaeger:
      condition: service_started
  profiles: ["app"]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shrink
      POSTGRES_PASSWORD: shrink
      POSTGRES_DB: shrink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shrink -d shrink"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # Uses the image's default command (uvicorn on 8000). Host port 8001 because the uv dev
  # server normally holds 8000.
  api:
    <<: *app
    ports:
      - "8001:8000"

  migrate:
    <<: *app
    command: ["shrink", "migrate"]

  pipeline:
    <<: *app
    command: ["shrink", "refresh"]

volumes:
  pgdata:
